name: Publicar site

on:
  push:
    branches: [main]
  # Em pull request o site e construido e conferido, mas NAO publicado. Sem
  # isto, pagina orfa e ancora morta so aparecem depois do merge, com o site
  # congelado na versao anterior — foi o que aconteceu com DESIGN.md e
  # PRODUCT.md, pegos por build manual e nao pelo CI.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez. `cancel-in-progress: false` porque cancelar um
# deploy pela metade deixa o site num estado indefinido.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar o site
        env:
          # O build pede a cada .md renderizado à API do próprio repositório.
          # Sem token seriam 60 requisições/hora por IP — o runner estoura.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Num PR, renderiza o conteúdo DO PR. Vazio num push, onde o branch
          # default já é o alvo certo.
          FURSEC_REF: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/build-site.py

      - name: Conferir que nenhum link interno quebrou
        run: python3 tools/check-site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Pull request confere e para aqui: publicar sai só de push na main.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
